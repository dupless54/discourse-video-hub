name: Format Probe

on:
  push:
    branches:
      - feature/video-collection-reorder-ui

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatter
        run: pnpm install --frozen-lockfile
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier assets/javascripts/discourse/components/video-hub-collections-manager.gjs test/javascripts/integration/components/video-hub-collections-manager-test.gjs --write
          git diff -- assets/javascripts/discourse/components/video-hub-collections-manager.gjs test/javascripts/integration/components/video-hub-collections-manager-test.gjs

name: Format Probe

on:
  push:
    branches:
      - probe/watch-read-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec rubocop -A app/controllers/video_hub/videos_controller.rb app/services/video_hub/watch_query.rb config/routes.rb spec/requests/video_hub/videos_controller_spec.rb spec/services/video_hub/watch_query_spec.rb
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- app/controllers/video_hub/videos_controller.rb app/services/video_hub/watch_query.rb config/routes.rb spec/requests/video_hub/videos_controller_spec.rb spec/services/video_hub/watch_query_spec.rb

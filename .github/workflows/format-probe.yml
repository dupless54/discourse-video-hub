name: Format Probe

on:
  push:
    branches:
      - feature/profile-layout-editor

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier "assets/**/*.{scss,js,gjs}" "test/**/*.{js,gjs}" --write
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- assets/javascripts/discourse/components/video-hub-layout-draggable.gjs assets/javascripts/discourse/components/video-hub-profile-layout-editor.gjs assets/javascripts/discourse/routes/user/video-hub-profile-layout.js assets/javascripts/discourse/routes/user/video-hub-profile.js assets/javascripts/discourse/templates/user/video-hub-profile-layout.gjs assets/javascripts/discourse/templates/user/video-hub-profile.gjs assets/javascripts/discourse/video-hub-user-route-map.js assets/stylesheets/common/video-hub-profile.scss test/javascripts/acceptance/video-hub-profile-test.js

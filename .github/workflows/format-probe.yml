name: Format Probe

on:
  push:
    branches:
      - feature/profile-layout-read

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write app/services/video_hub/profile_layout_query.rb spec/services/video_hub/profile_layout_query_spec.rb
          git diff -- app/services/video_hub/profile_layout_query.rb spec/services/video_hub/profile_layout_query_spec.rb

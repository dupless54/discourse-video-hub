name: Format Probe

on:
  push:
    branches:
      - feature/bounded-video-metrics

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- app/models/video_hub/daily_metric.rb app/services/video_hub/record_metric.rb spec/models/video_hub/daily_metric_spec.rb spec/requests/video_hub/metrics_spec.rb spec/services/video_hub/record_metric_spec.rb

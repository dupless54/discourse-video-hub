name: Format Probe

on:
  push:
    branches:
      - probe/discovery-video-cards-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical frontend diff
        run: |
          pnpm lint:js:fix
          pnpm lint:css:fix
          pnpm lint:prettier:fix
          git diff -- \
            assets/javascripts/discourse/components/video-hub-card.gjs \
            assets/javascripts/discourse/components/video-hub-landing.gjs \
            assets/stylesheets/common/video-hub.scss \
            test/javascripts/integration/components/video-hub-landing-test.gjs

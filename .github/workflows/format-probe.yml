name: Format Probe

on:
  push:
    branches:
      - feature/profile-membership-editor-ui

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier \
            assets/javascripts/discourse/components/video-hub-profile-layout-editor.gjs \
            test/javascripts/acceptance/video-hub-profile-test.js \
            --write
          git diff -- \
            assets/javascripts/discourse/components/video-hub-profile-layout-editor.gjs \
            test/javascripts/acceptance/video-hub-profile-test.js

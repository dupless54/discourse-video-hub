name: Format Probe

on:
  push:
    branches:
      - feature/video-collection-reorder-api

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatter
        run: bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write app/services/video_hub/collection_manager.rb spec/requests/video_hub/collections_controller_spec.rb spec/services/video_hub/collection_manager_spec.rb
          git diff -- app/services/video_hub/collection_manager.rb spec/requests/video_hub/collections_controller_spec.rb spec/services/video_hub/collection_manager_spec.rb

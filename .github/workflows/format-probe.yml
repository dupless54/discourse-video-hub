name: Format Probe

on:
  push:
    branches:
      - probe/watch-core-discussion-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical frontend diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm lint:js:fix
          pnpm lint:css:fix
          pnpm lint:prettier:fix
          git diff -- \
            assets/javascripts/discourse/components/video-hub-discussion.gjs \
            assets/javascripts/discourse/components/video-hub-watch.gjs \
            assets/javascripts/discourse/routes/video-hub-watch.js \
            assets/stylesheets/common/video-hub.scss \
            test/javascripts/acceptance/video-hub-watch-test.js

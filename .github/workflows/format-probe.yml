name: Format Probe

on:
  push:
    branches:
      - feature/immersive-explore-feed

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm stylelint "assets/stylesheets/common/video-hub-explore.scss" --fix
          pnpm prettier \
            "assets/stylesheets/common/video-hub-explore.scss" \
            "assets/javascripts/discourse/components/video-hub-landing.gjs" \
            "test/javascripts/acceptance/video-hub-explore-test.js" \
            "test/javascripts/integration/components/video-hub-explore-test.gjs" \
            --write
          git diff -- \
            assets/stylesheets/common/video-hub-explore.scss \
            assets/javascripts/discourse/components/video-hub-landing.gjs \
            test/javascripts/acceptance/video-hub-explore-test.js \
            test/javascripts/integration/components/video-hub-explore-test.gjs

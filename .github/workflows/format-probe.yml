name: Format Probe

on:
  push:
    branches:
      - probe/idempotent-publisher-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec rubocop -A app/services/video_hub/publish_policy.rb app/services/video_hub/publish_video.rb spec/services/video_hub/publish_policy_spec.rb spec/services/video_hub/publish_video_spec.rb
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- app/services/video_hub/publish_policy.rb app/services/video_hub/publish_video.rb spec/services/video_hub/publish_policy_spec.rb spec/services/video_hub/publish_video_spec.rb

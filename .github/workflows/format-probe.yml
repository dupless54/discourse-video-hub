name: Format Probe

on:
  push:
    branches:
      - feature/profile-membership-mutations

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write \
            app/controllers/video_hub/profiles_controller.rb \
            app/services/video_hub/profile_membership_mutator.rb \
            config/routes.rb \
            spec/services/video_hub/profile_layout_updater_spec.rb \
            spec/services/video_hub/profile_membership_mutator_spec.rb
          git diff -- \
            app/controllers/video_hub/profiles_controller.rb \
            app/services/video_hub/profile_membership_mutator.rb \
            config/routes.rb \
            spec/services/video_hub/profile_layout_updater_spec.rb \
            spec/services/video_hub/profile_membership_mutator_spec.rb

name: Format Probe

on:
  push:
    branches:
      - probe/tiktok-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec rubocop -A lib/video_hub/providers/tiktok.rb spec/lib/video_hub/providers/tiktok_spec.rb
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- lib/video_hub/providers/tiktok.rb spec/lib/video_hub/providers/tiktok_spec.rb

name: Format Probe

on:
  push:
    branches:
      - probe/video-publish-form-format

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical frontend diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm lint:js:fix
          pnpm lint:css:fix
          pnpm lint:prettier:fix
          git diff -- \
            assets/javascripts/discourse/components/video-hub-landing.gjs \
            assets/javascripts/discourse/components/video-hub-publish-form.gjs \
            assets/javascripts/discourse/templates/video-hub-new.gjs \
            assets/javascripts/discourse/video-hub-route-map.js \
            assets/stylesheets/common/video-hub.scss \
            test/javascripts/acceptance/video-hub-publish-test.js \
            test/javascripts/integration/components/video-hub-landing-test.gjs

name: Format Probe

on:
  push:
    branches:
      - probe/video-persistence-format-v2

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec rubocop -A app/models/video_hub/video.rb db/migrate/20260828003000_create_video_hub_videos.rb spec/models/video_hub/video_spec.rb
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- app/models/video_hub/video.rb db/migrate/20260828003000_create_video_hub_videos.rb spec/models/video_hub/video_spec.rb

name: Temporary Syntax Tree Probe

on:
  push:
    branches:
      - fix/profile-video-catalog-feed-endpoint

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby formatters
        run: bundle install
      - name: Print canonical Syntax Tree diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write spec/requests/video_hub/profile_catalog_feed_alias_spec.rb
          git diff -- spec/requests/video_hub/profile_catalog_feed_alias_spec.rb

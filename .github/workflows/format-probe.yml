name: Format Probe

on:
  push:
    branches:
      - feature/mobile-active-player-feed

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier \
            assets/javascripts/discourse/components/video-hub-mobile-feed-item.gjs \
            test/javascripts/integration/components/video-hub-landing-test.gjs \
            --write
          git diff -- \
            assets/javascripts/discourse/components/video-hub-mobile-feed-item.gjs \
            test/javascripts/integration/components/video-hub-landing-test.gjs

name: Format Probe

on:
  push:
    branches:
      - feature/video-collection-catalog-api

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatter
        run: bundle install
      - name: Apply canonical formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bundle exec stree write app/services/video_hub/collection_catalog_query.rb spec/services/video_hub/collection_catalog_query_spec.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/video_hub/collection_catalog_query.rb spec/services/video_hub/collection_catalog_query_spec.rb
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: apply canonical collection catalog formatting"
            git push origin HEAD:feature/video-collection-catalog-api
          fi

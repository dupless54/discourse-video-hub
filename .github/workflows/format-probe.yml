name: Format Probe

on:
  push:
    branches:
      - feature/video-collection-reorder-ui

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatter
        run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier assets/javascripts/discourse/components/video-hub-collections-manager.gjs test/javascripts/integration/components/video-hub-collections-manager-test.gjs --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/javascripts/discourse/components/video-hub-collections-manager.gjs test/javascripts/integration/components/video-hub-collections-manager-test.gjs
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: apply canonical collection reorder UI formatting"
            git push origin HEAD:feature/video-collection-reorder-ui
          fi

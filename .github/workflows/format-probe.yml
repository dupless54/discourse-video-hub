name: Format Probe

on:
  push:
    branches:
      - feature/watch-terminal-seo

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install formatters
        run: |
          pnpm install --frozen-lockfile
          bundle install
      - name: Print canonical formatting diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm prettier "assets/**/*.{scss,js,gjs}" "test/**/*.{js,gjs}" --write
          bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')
          git diff -- spec/requests/video_hub/watch_terminal_seo_spec.rb spec/services/video_hub/watch_query_spec.rb

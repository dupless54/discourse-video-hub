name: Syntax Tree Probe

on:
  push:
    branches:
      - feature/collection-management-video-payload

jobs:
  stree:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - run: bundle install
      - run: |
          bundle exec stree write spec/requests/video_hub/collections_controller_spec.rb
          cat spec/requests/video_hub/collections_controller_spec.rb

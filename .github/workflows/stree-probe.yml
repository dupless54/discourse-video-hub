name: Stree Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - run: bundle install
      - name: Canonical Syntax Tree output
        run: |
          bundle exec stree write \
            app/controllers/video_hub/collections_controller.rb \
            app/services/video_hub/collection_manager.rb \
            spec/requests/video_hub/collections_controller_spec.rb \
            spec/services/video_hub/collection_manager_spec.rb
          for file in \
            app/controllers/video_hub/collections_controller.rb \
            app/services/video_hub/collection_manager.rb \
            spec/requests/video_hub/collections_controller_spec.rb \
            spec/services/video_hub/collection_manager_spec.rb; do
            echo "===== ${file} ====="
            cat "${file}"
          done

name: Syntax Tree Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby dependencies
        run: bundle install
      - name: Show canonical Syntax Tree output
        run: |
          bundle exec stree write spec/services/video_hub/trending_feed_cursor_spec.rb
          cat spec/services/video_hub/trending_feed_cursor_spec.rb

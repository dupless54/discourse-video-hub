name: Format Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby dependencies
        run: bundle install
      - name: Show canonical Syntax Tree diff
        run: |
          bundle exec stree write app/services/video_hub/ranking_signals.rb
          bundle exec stree write spec/services/video_hub/ranking_signals_spec.rb
          git diff --no-renames -- app/services/video_hub/ranking_signals.rb spec/services/video_hub/ranking_signals_spec.rb

name: Format Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby dependencies
        run: bundle install
      - name: Show canonical Syntax Tree output
        run: |
          echo '--- ranking_context.rb ---'
          bundle exec stree format app/services/video_hub/ranking_context.rb
          echo '--- ranking_cursor.rb ---'
          bundle exec stree format app/services/video_hub/ranking_cursor.rb
          echo '--- ranking_context_spec.rb ---'
          bundle exec stree format spec/services/video_hub/ranking_context_spec.rb
          echo '--- ranking_cursor_spec.rb ---'
          bundle exec stree format spec/services/video_hub/ranking_cursor_spec.rb

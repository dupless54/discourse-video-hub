name: Format Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Show canonical Prettier output
        run: |
          pnpm prettier test/javascripts/acceptance/video-hub-saved-test.js --write
          cat test/javascripts/acceptance/video-hub-saved-test.js

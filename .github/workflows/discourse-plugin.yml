name: Format Probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby dependencies
        run: bundle install
      - name: Show canonical Syntax Tree output
        run: |
          for file in \
            app/controllers/video_hub/videos_controller.rb \
            app/services/video_hub/saved_video.rb \
            config/routes.rb \
            spec/requests/video_hub/saved_videos_spec.rb
          do
            echo "--- ${file} ---"
            bundle exec stree format "${file}"
          done

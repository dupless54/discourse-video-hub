name: Syntax Tree Probe

on:
  pull_request:

jobs:
  stree:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - run: bundle install
      - name: Print canonical formatting
        run: |
          bundle exec stree write app/controllers/video_hub/videos_controller.rb spec/services/video_hub/following_feed_cursor_spec.rb spec/services/video_hub/following_feed_query_spec.rb
          echo '---CONTROLLER---'
          cat app/controllers/video_hub/videos_controller.rb
          echo '---CURSOR_SPEC---'
          cat spec/services/video_hub/following_feed_cursor_spec.rb
          echo '---QUERY_SPEC---'
          cat spec/services/video_hub/following_feed_query_spec.rb
